name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASTRA_DEV_KEYSTORE_BASE64: ${{ secrets.ASTRA_DEV_KEYSTORE_BASE64 }}
      ASTRA_DEV_KEYSTORE_PASSWORD: ${{ secrets.ASTRA_DEV_KEYSTORE_PASSWORD }}
      ASTRA_DEV_KEY_ALIAS: ${{ secrets.ASTRA_DEV_KEY_ALIAS }}
      ASTRA_DEV_KEY_PASSWORD: ${{ secrets.ASTRA_DEV_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Prepare stable signing key
        if: ${{ env.ASTRA_DEV_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ASTRA_DEV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/astra-dev.jks"

      - name: Build debug APK
        env:
          ASTRA_DEV_KEYSTORE_FILE: ${{ runner.temp }}/astra-dev.jks
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: project-astra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
